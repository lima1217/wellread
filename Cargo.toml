[workspace]
members = [
  "apps/readest-app/src-tauri",
  "packages/tauri-plugins/plugins/fs"
]
exclude = [
  "packages/qcms",
  # The vendored tauri fork is its own workspace (its crates inherit
  # `workspace.dependencies`/`workspace.lints` from packages/tauri/Cargo.toml
  # since upstream 2.12); it is consumed via [patch.crates-io] below.
  "packages/tauri"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
log = "0.4"
tauri = { version = "2", default-features = false }
tauri-build = "2"
tauri-plugin = "2"
tauri-utils = "2"
schemars = "0.8"
serde_json = "1"
thiserror = "2"
glob = "0.3"
zbus = "5.9"
dunce = "1"
url = "2"
tar = "0.4.45"
nix = "0.20.2"
glib = "0.20.0"

[workspace.package]
authors = ["Bilingify LLC"]
homepage = "https://readest.com"
license = "AGPL-3.0"
repository = "https://github.com/readest/readest"
categories = []
edition = "2021"
rust-version = "1.77.2"

[patch.crates-io]
tauri = { path = "packages/tauri/crates/tauri" }
tauri-plugin-fs = { path = "packages/tauri-plugins/plugins/fs" }
# Xcode 26.2 (Swift 6.2) broke swift-rs's per-swiftc target override for
# cross builds. Upstream 1.0.9 only switches to `--triple`/`--sdk` on Xcode 27;
# the vendored copy (1.0.9 + READEST PATCH) does so for every cross build.
# See packages/swift-rs/src-rs/build.rs.
swift-rs = { path = "packages/swift-rs" }
# No tao patch: tauri 2.12 uses tao 0.37, whose iOS
# configuration_for_connecting_scene_session already returns the
# UISceneConfiguration autoreleased (the use-after-free packages/tao fixed
# for 0.35.3).
